plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jack.shelf'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jack.shelf'
        minSdk 21
        targetSdk 33
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }


    // The keystore itself is never committed: CI writes it from the KS_B64 repository secret.
    def ks = file('release.jks')
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword 'shelf-signing'
                keyAlias 'shelf'
                keyPassword 'shelf-signing'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
