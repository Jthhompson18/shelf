name: Build Shelf
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch background photos (Unsplash License)
        run: |
          mkdir -p app/src/main/assets/wallpapers
          fetch() { # name images.unsplash.com-photo-id
            url="https://images.unsplash.com/$2?w=1920&h=1080&fit=crop&crop=entropy&q=82&fm=jpg"
            if curl -fsSL --retry 3 -A "Mozilla/5.0" -o "app/src/main/assets/wallpapers/$1.jpg" "$url"; then
              echo "ok $1 $(stat -c %s app/src/main/assets/wallpapers/$1.jpg)"
            else echo "download failed $1"; rm -f "app/src/main/assets/wallpapers/$1.jpg"; fi
          }
          # Sunny / clear days
          fetch day_01 photo-1755792023406-3163add49fa2    # Bondi from above
          fetch day_02 photo-1768190691654-09c492f220f4    # Espiritu Santo, Vanuatu
          fetch day_03 photo-1562375121-ea1bc3e8fc10       # Moraine Lake
          fetch day_04 photo-1508899005055-fb1677e7b887    # Peyto Lake
          fetch day_05 photo-1766119871772-0bf74304a9e7    # Jiuzhaigou
          # Cloudy / rainy days
          fetch cloud_01 photo-1765571093286-e492fd3ca368  # Lake Hawea under cloud
          fetch cloud_02 photo-1522151501326-e0dc6eb350e1  # Bondi barrel wave
          # Night
          fetch night_01 photo-1674718061623-2d1902f6889d  # Milky Way over a beach house
          fetch night_02 photo-1696187489150-c692cc723196  # Stars over the water
          fetch night_03 photo-1743364892984-1b7e34054a6b  # Stars over a calm lake
          ls -la app/src/main/assets/wallpapers
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk shelf.apk
          gh release create "v${{ github.run_number }}" shelf.apk --title "Shelf build ${{ github.run_number }}" --notes "Install on the projector with Downloader." --latest
        env:
          GH_TOKEN: ${{ github.token }}
